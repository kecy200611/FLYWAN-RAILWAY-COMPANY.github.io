<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飛灣鐵路 ATO 自動駕駛模擬器 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-body: #000;
            --bg-panel: #141414;
            --color-ato: #00ccff;   
            --color-atp: #ffaa00;   
            --color-ok: #00ff00;    
            --color-err: #ff3333;
            --color-radio: #ff0055;   
            --font-main: "Consolas", "Microsoft JhengHei", sans-serif;
        }

        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background-color: var(--bg-body); font-family: var(--font-main); color: #eee; user-select: none; display: flex; flex-direction: column; }

        /* UI Overlay */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .box { background: #222; border: 3px solid var(--color-ato); border-radius: 10px; padding: 30px; width: 90%; max-width: 500px; text-align: center; }
        select { width: 100%; padding: 10px; background: #333; color: #fff; margin: 10px 0; border: 1px solid #555; font-size: 16px; }
        button { width: 100%; padding: 15px; font-size: 20px; background: var(--color-ok); border: none; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 5px; color:#000; }
        .fail-box { border-color: var(--color-err); }
        .win-box { border-color: var(--color-ok); }

        /* Viewport */
        #viewport { position: relative; flex: 60; background: #000; overflow: hidden; border-bottom: 5px solid #333; cursor: pointer; touch-action: none; }
        #game-canvas { display: block; width: 100%; height: 100%; outline: none; }

        /* Floating UI */
        #station-sign { 
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.9); color: #004b87; border: 4px solid #004b87; padding: 10px 20px; 
            font-weight: 900; font-size: 24px; border-radius: 4px; z-index: 50; white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; 
        }
        #msg-center {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); color: #fff; padding: 30px 50px;
            font-size: 36px; display: none; z-index: 100; border-radius: 15px;
            border: 4px solid var(--color-atp); text-align: center; font-weight: bold;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); white-space: pre-line;
        }

        /* Dashboard */
        #dashboard { position: relative; flex: 40; background-color: var(--bg-panel); display: flex; box-shadow: inset 0 10px 20px rgba(0,0,0,0.8); z-index: 20; }
        .panel-signal { flex: 3; border-right: 2px solid #333; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* 響應式儀表板設定 */
        .speed-gauge-wrap { position: relative; width: 100%; max-width: 180px; aspect-ratio: 1 / 1; margin: 5px auto; display: flex; align-items: center; justify-content: center; }
        .speed-gauge-wrap svg { width: 100%; height: 100%; }
        .speed-num { position: absolute; font-size: clamp(1.5em, 5vw, 2.5em); font-weight: bold; color: var(--color-ato); line-height: 1; pointer-events: none; }
        
        .ring-bg { fill: none; stroke: #222; stroke-width: 20; }
        .ring-limit { fill: none; stroke: var(--color-atp); stroke-width: 20; stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 50% 50%; stroke-dasharray: 0 1000; transition: stroke-dasharray 0.1s linear; opacity: 0.8; }
        .ring-val { fill: none; stroke: var(--color-ato); stroke-width: 12; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; stroke-dasharray: 0 1000; transition: stroke-dasharray 0.1s linear; }
        .flashing { animation: blink 0.2s infinite; }
        .radio-flash { animation: flashRed 0.15s infinite; stroke: var(--color-radio) !important; }

        .lamp { width: 90%; text-align: center; padding: 5px; background: #333; margin-top: 5px; border-radius: 4px; color: #555; font-weight: bold; font-size: 0.8em; }
        .lamp.on { background: var(--color-err); color: #fff; box-shadow: 0 0 10px #ff3333; }
        .lamp.warn { background: var(--color-atp); color: #000; box-shadow: 0 0 10px var(--color-atp); animation: blink 0.5s infinite; }
        .lamp.radio { background: var(--color-radio); color: #fff; box-shadow: 0 0 15px var(--color-radio); animation: flashRed 0.15s infinite; border: 2px solid #fff; }
        .lamp.vigilance { background: #00cc00; color: #000; box-shadow: 0 0 15px #00ff00; animation: blink 0.2s infinite; border: 2px solid #fff; }
        .lamp.ato-active { background: var(--color-ato); color: #000; box-shadow: 0 0 15px var(--color-ato); font-weight: 900; }

        .ma-container { width: 90%; margin-top: auto; background: #111; border: 1px solid #444; padding: 5px; border-radius: 8px; }
        #stop-gauge { position: relative; width: 100%; height: 25px; background: #ccc; margin-top: 5px; border-radius: 4px; overflow: hidden; border: 2px solid #555; }
        #stop-gauge-line { position: absolute; left: 50%; top: 0; height: 100%; width: 2px; background: #000; transform: translateX(-50%); z-index: 5; }
        #stop-gauge-dot { position: absolute; top: 50%; width: 12px; height: 12px; background: #f00; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 10; box-shadow: 0 0 2px rgba(0,0,0,0.5); }

        .panel-tcms { flex: 3; border-right: 2px solid #333; padding: 10px; display: flex; flex-direction: column; cursor: pointer; }
        .panel-tcms:active { background: #222; }
        #ui-status-monitor { background: #222; border: 1px solid #555; color: #888; padding: 10px; margin-top: 10px; text-align: center; font-weight: bold; font-size: 1.1em; border-radius: 5px;}
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
        .data-item { background: #222; padding: 5px; border-radius: 4px; border: 1px solid #444; text-align: center; }
        .data-lbl { color: #888; font-size: 0.6em; }
        .data-val { color: #fff; font-size: 0.9em; font-weight: bold; }

        .panel-controls { flex: 2; background: #222; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .lever-group { display: flex; width: 100%; justify-content: space-around; height: 80%; opacity: 0.5; /* ATO模式下把推桿變半透明表示不可控 */ pointer-events: none; }
        .lever-track { position: relative; width: 30px; background: #111; border: 1px solid #555; border-radius: 10px; height: 100%; display: flex; flex-direction: column; }
        .lever-handle { position: absolute; left: 2px; width: 24px; height: 20px; border-radius: 5px; transition: top 0.1s; box-shadow: 0 2px 5px #000; z-index: 10; cursor: grab; }
        #handle-pwr { background: #00cc00; top: 90%; }
        #handle-brk { background: #ff3333; top: 50%; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes flashRed { 0% { opacity: 1; background: var(--color-radio); } 50% { opacity: 0.5; background: #500; } 100% { opacity: 1; background: var(--color-radio); } }
    </style>
</head>
<body onclick="window.focus()">

<div id="overlay">
    <div id="menu-box" class="box">
        <h2 style="color:var(--color-ato)">飛灣鐵路模擬器 3D <br><span style="font-size:0.6em; color:var(--color-ok)">[ATO 自動駕駛版]</span></h2>
        <div style="text-align:left;">
            <label>起始車站</label><select id="start-sel"></select>
            <label>行駛方向</label><select id="dir-sel"><option value="down">下行 (往 全京)</option><option value="up">上行 (往 工業區)</option></select>
            <label>車種</label><select id="type-sel"><option value="local">普通 (Local)</option><option value="express">機場快速 (Express)</option></select>
            <label style="color:var(--color-radio)">緊急狀況</label>
            <select id="emer-sel" style="border-color:var(--color-radio)">
                <option value="none">無 (None)</option>
                <option value="always">有 (Yes)</option>
                <option value="random">隨機 (Random)</option>
            </select>
        </div>
        <p style="font-size:0.8em; color:#aaa; margin-top:10px; line-height: 1.6;">
            1. 本模式已啟用 ATO，列車將自動開往終點站<br>
            2. 電腦將自動控速、精準停車並開關車門<br>
        </p>
        <button onclick="startGame()">啟動 ATO (AUTO START)</button>
    </div>
    
    <div id="result-box" class="box" style="display:none;">
        <h1 id="res-title">運行結束</h1>
        <p id="res-desc" style="font-size:1.2em; white-space: pre-line;"></p>
        <button onclick="location.reload()" style="background:#fff; color:#000;">重新開始</button>
    </div>
</div>

<div id="viewport">
    <canvas id="game-canvas"></canvas>
    <div id="station-sign">車站</div>
    <div id="msg-center"></div>
</div>

<div id="dashboard">
    <div class="panel-signal">
        <div style="color:#888; font-size:0.8em;">ATO MONITOR</div>
        <div class="speed-gauge-wrap">
            <svg width="180" height="180" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="80" class="ring-bg"></circle>
                <circle id="gauge-limit" cx="100" cy="100" r="80" class="ring-limit"></circle>
                <circle id="gauge-speed" cx="100" cy="100" r="80" class="ring-val"></circle>
            </svg>
            <div class="speed-num"><span id="ui-speed">0</span></div>
        </div>
        <div id="lamp-atp" class="lamp ato-active">ATO ACTIVE</div>
        
        <div class="ma-container">
            <div class="ma-info" style="font-size:0.7em; display:flex; justify-content:space-between;">
                <span>DIST</span><span id="ui-dist" style="color:var(--color-ato)">0 m</span>
            </div>
            
            <div id="stop-gauge">
                <div id="stop-gauge-line"></div>
                <div id="stop-gauge-dot"></div>
                <div style="position:absolute; left:0; top:0; height:100%; width:1px; background:#999;"></div>
                <div style="position:absolute; right:0; top:0; height:100%; width:1px; background:#999;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.6em; color:#888; margin-top:2px;">
                <span>-1M</span>
                <span>+1M</span>
            </div>
        </div>
    </div>

    <div class="panel-tcms">
        <div style="border-bottom:1px solid #444; color:var(--color-ato); display:flex; justify-content:space-between;">
            <span>TCMS</span><span id="ui-clock">12:00</span>
        </div>
        <div id="ui-status-monitor" class="status-monitor">CHECKING...</div>
        <div class="data-grid">
            <div class="data-item"><div class="data-lbl">CURRENT</div><div class="data-val" id="ui-curr" style="color:var(--color-ok)">-</div></div>
            <div class="data-item"><div class="data-lbl">NEXT STOP</div><div class="data-val" id="ui-next">-</div></div>
            <div class="data-item"><div class="data-lbl">LIMIT</div><div class="data-val" id="ui-limit" style="color:var(--color-atp)">0</div></div>
            <div class="data-item"><div class="data-lbl">GRAD</div><div class="data-val" id="ui-grad">0‰</div></div>
            <div class="data-item"><div class="data-lbl">DOOR</div><div class="data-val" id="ui-door">CLSD</div></div>
            <div class="data-item"><div class="data-lbl">BC</div><div class="data-val" id="ui-bc">0.0</div></div>
        </div>
        <div id="lamp-door-warn" class="lamp" style="margin-top:auto;">DOOR CLOSING</div>
    </div>

    <div class="panel-controls">
        <div class="lever-group">
            <div style="position:relative;">
                <div class="lever-track"><div class="lever-handle" id="handle-brk"></div></div>
                <div style="text-align:center; font-size:0.6em; margin-top:5px; color:#aaa;">BRK</div>
            </div>
            <div style="position:relative;">
                <div class="lever-track"><div class="lever-handle" id="handle-pwr"></div></div>
                <div style="text-align:center; font-size:0.6em; margin-top:5px; color:#aaa;">PWR</div>
            </div>
        </div>
        <div style="font-size:0.7em; color:var(--color-ato); margin-top:5px; text-align:center;">自動駕駛中<br>Enter=回覆行控</div>
    </div>
</div>

<script>
// --- 路線資料 ---
    const STATIONS = [
        { name: "FR01 飛灣工業區", dist: 0, type: "double_island", exp: true }, 
        { name: "FR02 飛灣港", dist: 7300, type: "passing_side", exp: false },
        { name: "FR03 物流中心", dist: 8600, type: "side", exp: false },
        { name: "FR04 飛灣郵輪港", dist: 9800, type: "double_island", exp: true },
        { name: "FR05 濱江商務區", dist: 17000, type: "side", exp: false },
        { name: "FR06 市民廣場", dist: 18500, type: "passing_side", exp: false },
        { name: "FR07 文化中心", dist: 19800, type: "side", exp: false },
        { name: "FR08 飛灣新站", dist: 21700, type: "double_island", exp: true },
        { name: "FR09 科創園", dist: 24000, type: "passing_side", exp: false },
        { name: "FR10 飛灣學區", dist: 25200, type: "side", exp: false },
        { name: "FR11 飛灣大道", dist: 26900, type: "island", exp: false },
        { name: "FR12 飛灣公園", dist: 28500, type: "double_island", exp: true },
        { name: "FR13 錦湖", dist: 29900, type: "side", exp: false },
        { name: "FR14 鷺島", dist: 30400, type: "side", exp: false },
        { name: "FR15 空港新城", dist: 33200, type: "island", exp: false },
        { name: "FR16 飛灣機場", dist: 38100, type: "double_island", exp: true },
        { name: "FR17 翡翠花園", dist: 43300, type: "side", exp: false },
        { name: "FR18 紫荊苑", dist: 46500, type: "passing_side", exp: false },
        { name: "FR19 御景新村", dist: 54700, type: "island", exp: false },
        { name: "FR20 自然保育中心", dist: 56100, type: "side", exp: false },
        { name: "FR21 綾路北站", dist: 57900, type: "double_island_end", exp: true },
        { name: "FR22 全京大道", dist: 59100, type: "island", exp: false }
    ];

    const SPEED_ZONES = [
        { start: 0, end: 400, limit: 45 },        
        { start: 9200, end: 9680, limit: 75 },    
        { start: 17900, end: 18380, limit: 75 },  
        { start: 28800, end: 29430, limit: 60 },  
        { start: 29500, end: 29820, limit: 90 },  
        { start: 32600, end: 32920, limit: 90 },  
        { start: 38400, end: 39030, limit: 90 },  
        { start: 57600, end: 58000, limit: 45 },  
        { start: 59350, end: 59500, limit: 45 },  
    ];

    const SIDING_STATIONS = ["FR02", "FR04", "FR06", "FR08", "FR09", "FR12", "FR16", "FR18"];
    const PHY = { MASS: 180000, MAX_TRAC: 185000, MAX_BRK: 280000, AERO: 6.0, ROLL: 2000, G: 9.8 };
    const CIRCUMFERENCE = 502; 
    const DECEL_SERVICE = 3.5;

    let state = {
        active: false, v: 0, d: 0, p: 0, b: 4, 
        door: true, doorClosing: false, doorOpening: false, doorTimer: 0,
        route: [], idx: 0, stops: 0,
        type: 'local', dir: 'down',
        lastT: 0, atpLimit: 120, grade: 0, timerInt: null,
        emer: { enabled: false, triggered: false, cleared: false, targetIdx: -1, triggerDist: 0, reactionTimer: 0, occTimer: 0, communicating: false, ebRequiredReset: false },
        idleTime: 0, vigilanceTimer: 5.0, vigilanceActive: false 
    };

    let sndWarn; try { sndWarn = new Audio('warning.m4a'); sndWarn.volume = 1.0; } catch(e){}

    const ui = {
        spd: document.getElementById('ui-speed'), rSpd: document.getElementById('gauge-speed'), rLim: document.getElementById('gauge-limit'),
        dist: document.getElementById('ui-dist'), gaugeDot: document.getElementById('stop-gauge-dot'),
        hPwr: document.getElementById('handle-pwr'), hBrk: document.getElementById('handle-brk'),
        sign: document.getElementById('station-sign'), msg: document.getElementById('msg-center'),
        door: document.getElementById('ui-door'), curr: document.getElementById('ui-curr'), next: document.getElementById('ui-next'),
        bc: document.getElementById('ui-bc'), lim: document.getElementById('ui-limit'), grad: document.getElementById('ui-grad'),
        status: document.getElementById('ui-status-monitor'), lampDoor: document.getElementById('lamp-door-warn'), lampAtp: document.getElementById('lamp-atp'),
        menu: document.getElementById('menu-box'), resBox: document.getElementById('result-box'), overlay: document.getElementById('overlay'), emerSel: document.getElementById('emer-sel')
    };

    let audioCtx, masterGain, motorHumOsc, motorHumGain, vvvfOsc, vvvfGain, rollNoise, rollFilter, rollGain;

    function initAudio() {
        if (audioCtx) return; 
        const AudioContext = window.AudioContext || window.webkitAudioContext; audioCtx = new AudioContext();
        masterGain = audioCtx.createGain(); masterGain.gain.value = 1.5; masterGain.connect(audioCtx.destination);
        motorHumOsc = audioCtx.createOscillator(); motorHumOsc.type = 'sine'; motorHumGain = audioCtx.createGain(); motorHumGain.gain.value = 0; motorHumOsc.connect(motorHumGain); motorHumGain.connect(masterGain); motorHumOsc.start();
        vvvfOsc = audioCtx.createOscillator(); vvvfOsc.type = 'sine'; vvvfGain = audioCtx.createGain(); vvvfGain.gain.value = 0; vvvfOsc.connect(vvvfGain); vvvfGain.connect(masterGain); vvvfOsc.start();
        let bufferSize = audioCtx.sampleRate * 2; let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1; 
        rollNoise = audioCtx.createBufferSource(); rollNoise.buffer = noiseBuffer; rollNoise.loop = true;
        rollFilter = audioCtx.createBiquadFilter(); rollFilter.type = 'lowpass'; rollFilter.frequency.value = 150;
        rollGain = audioCtx.createGain(); rollGain.gain.value = 0; rollNoise.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(masterGain); rollNoise.start();
    }

    function updateAudio() {
        if (!audioCtx) return;
        let speedKph = Math.abs(state.v * 3.6);
        if ((state.p > 0 || (state.b > 0 && state.b < 9)) && speedKph > 0.1) {
            let isAccelerating = state.p > 0; let pwrLevel = isAccelerating ? state.p / 4 : state.b / 8; let baseVol = isAccelerating ? 0.25 + (pwrLevel * 0.1) : 0.15 + (pwrLevel * 0.1);
            if (speedKph < 35) {
                let vvvfFreq = 150 + speedKph * 8; vvvfOsc.frequency.setTargetAtTime(vvvfFreq, audioCtx.currentTime, 0.1);
                let vvvfFade = speedKph > 15 ? 1 - ((speedKph - 15) / 20) : 1; vvvfGain.gain.setTargetAtTime(baseVol * 0.25 * vvvfFade, audioCtx.currentTime, 0.1);
            } else { vvvfGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }
            let humFreq = 100 + speedKph * 4.0; motorHumOsc.frequency.setTargetAtTime(humFreq, audioCtx.currentTime, 0.1);
            let humFade = speedKph > 40 ? Math.max(0, 1 - ((speedKph - 40) / 50)) : 1.0; motorHumGain.gain.setTargetAtTime(baseVol * 0.7 * humFade, audioCtx.currentTime, 0.1);
        } else {
            motorHumGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2); vvvfGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
        }
        if (speedKph > 0.1) {
            let speedRatio = speedKph / 140; let rGain = Math.min(Math.pow(speedRatio, 1.2) * 0.8, 0.8); rollGain.gain.setTargetAtTime(rGain, audioCtx.currentTime, 0.1);
            let filterFreq = 150 + Math.min(speedKph, 120) * 8; rollFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.1);
        } else { rollGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }
    }

    function playTrainDoorChime() {
        if (!audioCtx) return; const now = audioCtx.currentTime;
        for (let i = 0; i < 3; i++) {
            let offset = now + (i * 1.0); 
            let osc1 = audioCtx.createOscillator(); let gain1 = audioCtx.createGain(); osc1.type = 'sine'; osc1.frequency.value = 659.25; osc1.connect(gain1); gain1.connect(masterGain);
            gain1.gain.setValueAtTime(0, offset); gain1.gain.linearRampToValueAtTime(0.5, offset + 0.05); gain1.gain.exponentialRampToValueAtTime(0.01, offset + 0.4); osc1.start(offset); osc1.stop(offset + 0.5);
            let osc2 = audioCtx.createOscillator(); let gain2 = audioCtx.createGain(); osc2.type = 'sine'; osc2.frequency.value = 523.25; osc2.connect(gain2); gain2.connect(masterGain);
            gain2.gain.setValueAtTime(0, offset + 0.4); gain2.gain.linearRampToValueAtTime(0.5, offset + 0.45); gain2.gain.exponentialRampToValueAtTime(0.01, offset + 0.9); osc2.start(offset + 0.4); osc2.stop(offset + 1.0);
        }
    }

    let scene, camera, renderer;
    let pathPoints = []; 
    const TOTAL_DIST = 61900;
    let getTrackGeometry = () => ({ grade: 0 }); 

    function init3D() {
        const viewport = document.getElementById('viewport'); const canvas = document.getElementById('game-canvas');
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, logarithmicDepthBuffer: true }); renderer.setSize(viewport.clientWidth, viewport.clientHeight); renderer.setPixelRatio(window.devicePixelRatio);
        scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x87CEEB, 0.00015); scene.background = new THREE.Color(0x87CEEB);
        camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 5000);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(200, 500, 200); scene.add(dirLight);
        buildWorld(); window.addEventListener('resize', onWindowResize);
    }
    function onWindowResize() {
        const viewport = document.getElementById('viewport'); const canvas = document.getElementById('game-canvas');
        if(!camera || !renderer) return; camera.aspect = viewport.clientWidth / viewport.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    }

        updateNextStopUI(); state.lastT = performance.now(); requestAnimationFrame(loop);
    }

    function getNextStopInfo() {
        for (let i = state.idx + 1; i < state.route.length; i++) if (state.route[i].isStop) return state.route[i];
        return { name: "END", data: { dist: state.d } }; 
    }
    function updateNextStopUI() {
        let nextStop = getNextStopInfo(); ui.next.innerText = nextStop.name;
        let targetPos = (state.dir === 'down') ? nextStop.data.dist + 77 : nextStop.data.dist - 77; ui.dist.innerText = Math.floor(Math.abs(targetPos - state.d)) + " m";
    }

// --- ATO 邏輯核心 (五階段精準控制版) ---
    function processATO(dt) {
        if (!state.active || state.emer.triggered || state.door || state.doorClosing || state.doorOpening) return;

        let nextStop = getNextStopInfo();
        let targetPos = (state.dir === 'down') ? nextStop.data.dist + 77 : nextStop.data.dist - 77;
        let distToStop = (state.dir === 'down') ? (targetPos - state.d) : (state.d - targetPos);

        let currentKph = state.v * 3.6;
        let limit = state.atpLimit;

        // ==========================================
        // 階段 5：精準煞停與 B4 駐車 (距離 <= 0.5m)
        // ==========================================
        if (nextStop.isStop && distToStop <= 0.5) {
            state.p = 0;
            // 消除物理引擎微小滑行誤差
            if (Math.abs(state.v) < 0.1) state.v = 0; 

            if (state.v === 0) {
                state.b = 4; // 速度歸零，退回 B4 駐車
                
                // 停妥後自動開門
                if (!state.door && !state.doorOpening && !state.doorClosing) {
                    setTimeout(() => inputDoor(), 1000); 
                }
            } else {
                state.b = 8; // 還在微小滑動時，B8 咬死
            }
            updateUI(); return;
        }

        // ==========================================
        // 階段 4：低速滑行 Creeping (最後 10m)
        // 解決 3m 提早卡死 BUG，強迫車輛嚕進停止線
        // ==========================================
        if (nextStop.isStop && distToStop < 10 && distToStop > 0.5) {
            if (currentKph > 5) {
                state.p = 0; state.b = 4; // 稍微太快，輕踩煞車
            } else if (currentKph > 3) {
                state.p = 0; state.b = 2; // 微調減速
            } else if (currentKph < 1.5) {
                state.b = 0; state.p = 1; // 速度太慢快定桿了，補 P1 推車！
            } else {
                state.p = 0; state.b = 0; // 2~3 km/h 完美滑行
            }
            updateUI(); return;
        }

        // ==========================================
        // 階段 2 & 3：進站 B6 減速與低速退檔緩解
        // ==========================================
        let safeDist = Math.max(0.01, distToStop);
        let reqA = (state.v * state.v) / (2 * safeDist);
        
        // 當需要 0.75 m/s² 的減速力道時，切入進站模式
        let isStoppingPhase = nextStop.isStop && (distToStop < 1500) && (reqA > 0.75);

        if (isStoppingPhase) {
            state.p = 0;
            if (currentKph > 20) {
                // 【階段 2：大於 20km/h，主力 B6 減速】
                state.b = 6;
                if (reqA > 0.95) state.b = 7; // 下坡或過快時動態加壓
                if (reqA > 1.1) state.b = 8;
            } else {
                // 【階段 3：小於 20km/h，平滑退檔】
                if (currentKph > 15) state.b = 5;
                else if (currentKph > 10) state.b = 4;
                else if (currentKph > 6) state.b = 3;
                else state.b = 2;

                // 防呆機制：如果退檔後發現煞不住，立刻補煞車
                if (reqA > 0.9) state.b = 8;
                else if (reqA > 0.7) state.b = 6;
                // 防呆機制：如果煞太快導致快要提早停車，提早放開煞車滑行
                else if (reqA < 0.4) state.b = 0; 
            }
            updateUI(); return;
        }

        // ==========================================
        // 階段 1：區間巡航與極限 ATP 防護
        // 暴力咬住紅針，絕不超速
        // ==========================================
        if (currentKph >= limit) {
            state.p = 0; state.b = 8; // 碰到紅針，極限壓制
        } else if (currentKph >= limit - 0.5) {
            state.p = 0; state.b = 6; // 緊貼紅針時，使用 B6 同步下降
        } else if (currentKph >= limit - 1.5) {
            state.p = 0; state.b = 4;
        } else if (currentKph >= limit - 2.5) {
            state.p = 0; state.b = 2;
        } else {
            // 距離極速還有空間，持續加速到 (極速 - 2.5km/h)
            state.b = 0;
            let diff = (limit - 1) - currentKph;
            if (diff > 3) state.p = 4;
            else if (diff > 2) state.p = 3;
            else if (diff > 1) state.p = 2;
            else if (diff > 0) state.p = 1;
            else state.p = 0;
        }

        updateUI();
    }

    function loop(now) {
        if(!state.active) return;
        let dt = (now - state.lastT)/1000; if(dt > 0.1) dt = 0.1;
        state.lastT = now;
        resetVigilance(); // ATO自動駕駛，關閉閒置警醒功能

        calcEnv(dt);
        updateStatus();
        checkEmergency(dt);
        processATO(dt); // 執行 ATO

        if (!(!state.door && !state.doorClosing)) {
            let currentBc = (state.b === 9) ? 6.0 : (state.b / 8) * 4.5;
            if (currentBc < 2.0) { gameOver("操作違規\n車門未鎖閉時 BC 壓力不足\n(需維持 2.0 kPa 以上)", false); return; }
        }

        if (state.b < 9) state.emer.ebRequiredReset = false;
        if (!state.emer.triggered && state.b === 9 && !state.emer.communicating) {
            if (state.emer.ebRequiredReset === false) { gameOver("操作違規\n非緊急狀況不可使用緊急煞車 (EB)", false); return; }
        }

        if(state.door || state.doorClosing || (state.emer.triggered && state.v === 0 && !state.emer.cleared)) {
            state.v = 0;
            if(state.emer.communicating) {
                state.emer.occTimer -= dt; ui.msg.innerText = `📞 行控通話中...\n確認安全: ${Math.ceil(state.emer.occTimer)} 秒`; ui.msg.style.display = 'block';
                if(state.emer.occTimer <= 0) {
                    state.emer.communicating = false; state.emer.cleared = true; state.emer.triggered = false; state.emer.ebRequiredReset = true; 
                    showMsg("✅ 通話結束\n防護無線解除，ATO恢復行駛"); ui.lampAtp.classList.remove('radio');
                }
            }
        } else {
            let traction = 0;
            if(state.p > 0 && state.b === 0) { let r = Math.abs(state.v) / (130/3.6); let f = Math.max(0.65, 1 - r*0.35); traction = (state.p/4) * PHY.MAX_TRAC * f; }
            let brakeRatio = state.b / 8; if (state.b === 9) brakeRatio = 1.3; let brakeMax = brakeRatio * PHY.MAX_BRK;
            let dragMag = PHY.ROLL + (PHY.AERO * state.v * state.v); let dragForce = (state.v > 0) ? -dragMag : (state.v < 0 ? dragMag : 0);
            let gradeF = PHY.MASS * PHY.G * (state.grade / 1000); 

            let net = (state.v > 0) ? traction + dragForce - gradeF - brakeMax : traction + dragForce - gradeF + brakeMax;
            if (Math.abs(state.v) < 0.05 && state.p === 0 && Math.abs(traction + dragForce - gradeF) <= brakeMax) { net = 0; state.v = 0; }

            state.v += (net / PHY.MASS) * dt; let deltaD = state.v * dt;
            if (state.dir === 'down') state.d += deltaD; else state.d -= deltaD;

            if(!state.emer.triggered && state.v*3.6 > state.atpLimit + 1) { gameOver("ATP OVERSPEED (超速)", false); return; }

            let nextStop = getNextStopInfo(); let targetPos = (state.dir === 'down') ? nextStop.data.dist + 77 : nextStop.data.dist - 77;
            let distToStop = (state.dir === 'down') ? (targetPos - state.d) : (state.d - targetPos);
            
            if (distToStop < -0.6) { gameOver(`超過停車位置！\n超過 ${Math.abs(distToStop).toFixed(2)}m`, false); return; }

            if (state.idx < state.route.length - 1) {
                let nextNode = state.route[state.idx+1]; let nodePos = (state.dir === 'down') ? nextNode.data.dist + 77 : nextNode.data.dist - 77;
                let distToNode = (state.dir === 'down') ? (nodePos - state.d) : (state.d - nodePos);
                if (distToNode < 0 && !nextNode.isStop) { state.idx++; showMsg(nextNode.name + " 通過"); ui.curr.innerText = nextNode.name; }
            }
        }
        renderGame(dt); updateUI(); updateAudio(); requestAnimationFrame(loop);
    }

    function calcEnv(dt) {
        let geo = getTrackGeometry(state.d); state.grade = (state.dir === 'down') ? geo.grade : -geo.grade;
        let d = state.d; let maxLimit = 120; let finalLimit = maxLimit;
        let activeZones = [...SPEED_ZONES]; 
        if (state.type === 'local') { STATIONS.forEach(st => { let stCode = st.name.split(' ')[0]; if (SIDING_STATIONS.includes(stCode) && !st.name.includes("FR21")) { activeZones.push({ start: st.dist - 260, end: st.dist + 260, limit: 45 }); } }); }
        const TRAIN_LEN = (state.type === 'express') ? 130 : 85;
        let searchDist = 2000; let lookAheadPoints = [];
        
        activeZones.forEach(zone => {
            let effStart, effEnd;
            if (state.dir === 'down') { effStart = zone.start - 5; effEnd = zone.end + TRAIN_LEN; } else { effStart = zone.end + 5; effEnd = zone.start - TRAIN_LEN; }
            let distToStart = (state.dir === 'down') ? (effStart - d) : (d - effStart);
            let inZone = (state.dir === 'down') ? (d >= effStart && d <= effEnd) : (d <= effStart && d >= effEnd);
            if (inZone) { finalLimit = Math.min(finalLimit, zone.limit); } else if (distToStart > 0 && distToStart < searchDist) { lookAheadPoints.push({ dist: distToStart, limit: zone.limit }); }
        });

        let dynamicLimit = maxLimit;
        lookAheadPoints.forEach(pt => { dynamicLimit = Math.min(dynamicLimit, applyBrakingCurve(maxLimit, pt.limit, pt.dist)); });
        state.atpLimit = Math.min(finalLimit, dynamicLimit);
        if (state.door || state.doorClosing) state.atpLimit = 45;
    }

    function renderGame(dt) {
        const now = new Date(); const hours = now.getHours() + now.getMinutes()/60; let r, g, b;
        if (hours >= 6 && hours < 17) { r = 0.53; g = 0.81; b = 0.92; } else if (hours >= 17 && hours < 19) { r = 0.8; g = 0.5; b = 0.2; } else { r = 0.05; g = 0.05; b = 0.1; }
        scene.background.setRGB(r, g, b); if(scene.fog) scene.fog.color.setRGB(r, g, b);

        let offset = getTrainOffset(state.d, state.type, state.dir); let p = getPtDetail(state.d, offset); camera.position.set(p.x, p.y + 2.1, p.z);
        let lookDist = (state.dir === 'down') ? state.d + 50 : state.d - 50; let lookOffset = getTrainOffset(lookDist, state.type, state.dir);
        let pLook = getPtDetail(lookDist, lookOffset);
        if(state.v > 1) { let shake = (Math.random()-0.5) * 0.01 * (state.v/30); pLook.x += shake; pLook.y += shake; }
        camera.lookAt(pLook.x, pLook.y + 2.1, pLook.z);
        let nearStation = false; for(let s of STATIONS) if (Math.abs(state.d - s.dist) < 150) { nearStation = true; break; }
        ui.sign.style.display = nearStation ? 'block' : 'none'; renderer.render(scene, camera);
    }

    function checkEmergency(dt) {
        if (state.emer.enabled && !state.emer.triggered) {
            if (Math.abs(state.d - state.emer.triggerDist) < 10) { state.emer.triggered = true; state.emer.reactionTimer = 2.0; ui.lampAtp.className = 'lamp radio'; ui.lampAtp.innerText = "RADIO ALARM"; ui.rLim.classList.add('radio-flash'); }
        }
        if (state.emer.triggered && !state.emer.cleared) {
            state.atpLimit = 0; 
            if (state.v === 0) {
                if (!state.emer.communicating) { ui.msg.innerText = "⛔ 列車已緊急停車 ⛔\n請點擊螢幕或按 [Enter] 聯繫行控"; ui.msg.style.display = 'block'; }
            } else {
                if (state.emer.reactionTimer > 0) state.emer.reactionTimer -= dt;
                else if (state.b < 9) gameOver("防護無線警報響起\n未在 2 秒內使用緊急煞車 (EB)", false);
            }
        } else { ui.rLim.classList.remove('radio-flash'); }
    }

function inputDoor() {
        if(state.doorClosing || state.doorOpening || (state.emer.triggered && !state.emer.cleared)) return;
        if(state.door) { 
            state.doorClosing = true; state.doorTimer = 20; ui.msg.innerText = "⚠️ 月台發車鈴聲響起..."; ui.msg.style.display = "block"; ui.lampDoor.classList.add('on');
            if(sndWarn) { sndWarn.currentTime = 0; sndWarn.play().catch(()=>{}); } 
            if(state.timerInt) clearInterval(state.timerInt);
            state.timerInt = setInterval(() => {
                state.doorTimer--;
                if (state.doorTimer === 3) { ui.msg.innerText = "⚠️ 車門關閉中..."; playTrainDoorChime(); }
                if(state.doorTimer <= 0) {
                    clearInterval(state.timerInt); state.door = false; state.doorClosing = false; ui.lampDoor.classList.remove('on');
                    ui.door.innerText = "CLSD"; ui.door.style.color = "var(--color-ok)"; ui.msg.innerText = "🟢 發車！ (READY)"; setTimeout(() => ui.msg.style.display = "none", 2000);
                }
            }, 1000);
        } else {
            if(Math.abs(state.v) < 0.05) {
                let nextStop = getNextStopInfo(); let targetPos = (state.dir === 'down') ? nextStop.data.dist + 77 : nextStop.data.dist - 77;
                let diff = (state.dir === 'down') ? (targetPos - state.d) : (state.d - targetPos); let cm = Math.round(diff * 100);
                let resultText = (cm === 0) ? "🔥 完美停車 0 cm 🔥" : (cm > 0 ? `未達 ${cm} cm` : `超過 ${Math.abs(cm)} cm`);
                
                state.doorOpening = true; state.door = true; ui.lampDoor.classList.add('on'); ui.door.innerText = "OPNG"; ui.door.style.color = "var(--color-atp)"; ui.msg.innerText = "⚠️ 車門開啟中..."; ui.msg.style.display = "block"; playTrainDoorChime(); 
                
                setTimeout(() => {
                    state.doorOpening = false; ui.lampDoor.classList.remove('on'); ui.door.innerText = "OPEN"; ui.door.style.color = "var(--color-err)"; ui.msg.style.display = "none";
                    state.stops++;
                    if (state.idx >= state.route.length - 1) { 
                        gameOver(`全線運行完成！\n最終站誤差: ${resultText}`, true);
                    } else {
                        state.idx++; showMsg(`自動停靠成功\n${resultText}`); updateNextStopUI(); ui.curr.innerText = state.route[state.idx].name;
                        // 取消了這裡的自動關門代碼，現在請手動按空白鍵關門
                    }
                }, 3000);
            } else { showMsg("行駛中無法開門"); }
        }
    }

    function confirmRadio() { if (state.emer.triggered && !state.emer.cleared && !state.emer.communicating && state.v === 0) { state.emer.communicating = true; state.emer.occTimer = 10; } }
    function resetVigilance() { state.idleTime = 0; state.vigilanceActive = false; state.vigilanceTimer = 5.0; }
    
    window.addEventListener('keydown', (e) => {
        if(!state.active) return; resetVigilance(); 
        switch(e.key.toLowerCase()) {
            case ' ': inputDoor(); break;
            case 'enter': confirmRadio(); break;
        }
    });
    document.getElementById('game-canvas').addEventListener('click', (e) => {
        resetVigilance(); 
        if(state.emer.triggered && !state.emer.cleared && state.v === 0) confirmRadio();
        else if(Math.abs(state.v) < 0.1) inputDoor();
    });
    
    function updateStatus() {
        let msg = "", color = "#888";
        if(state.doorClosing) { msg=`⏳ 關門中 (${state.doorTimer})`; color="var(--color-atp)"; }
        else if(state.door) { msg="⛔ 車門開啟"; color="var(--color-err)"; }
        else if(state.b > 0) { msg = (state.b === 9) ? `🚨 緊急煞車 (EB)` : `⛔ ATO煞車 (B${state.b})`; color="var(--color-err)"; }
        else if(state.p === 0) { msg="⚪ ATO惰行 (Coasting)"; color="#fff"; }
        else { msg=`🟢 ATO牽引 (P${state.p})`; color="var(--color-ok)"; }
        if(state.emer.triggered && !state.emer.cleared) { if (state.emer.communicating) { msg = "📞 通話確認中..."; color = "var(--color-atp)"; } else { msg = "⚠️ 防護無線動作"; color = "var(--color-radio)"; } }
        ui.status.innerText = msg; ui.status.style.color = color; ui.status.style.borderColor = color;
    }
    function updateUI() {
        let kph = state.v * 3.6; ui.spd.innerText = Math.floor(Math.abs(kph));
        let limPct = state.atpLimit / 140; if(limPct>1) limPct=1; ui.rLim.style.strokeDasharray = `${limPct * CIRCUMFERENCE} 1000`;
        let spdPct = Math.abs(kph) / 140; if(spdPct>1) spdPct=1; ui.rSpd.style.strokeDasharray = `${spdPct * CIRCUMFERENCE} 1000`;
        updateNextStopUI(); let nextStop = getNextStopInfo(); let targetPos = (state.dir === 'down') ? nextStop.data.dist + 77 : nextStop.data.dist - 77;
        let diff = (state.dir === 'down') ? (targetPos - state.d) : (state.d - targetPos);
        if (Math.abs(diff) <= 2.5) { ui.gaugeDot.style.display = 'block'; let pct = ((diff + 2.5) / 5.0) * 100; if(pct < 0) pct = 0; if(pct > 100) pct = 100; ui.gaugeDot.style.left = pct + "%"; ui.gaugeDot.style.background = (Math.abs(diff) <= 0.5) ? "#00ff00" : "#ff0000"; } else ui.gaugeDot.style.display = 'none';
        let bcVal = (state.b/8)*4.5; if(state.b === 9) bcVal = 6.0; ui.bc.innerText = bcVal.toFixed(1); ui.lim.innerText = Math.floor(state.atpLimit);
        ui.grad.innerText = state.grade.toFixed(1) + "‰"; ui.grad.style.color = (state.grade > 0) ? "var(--color-err)" : ((state.grade < 0) ? "var(--color-ok)" : "#eee");
        ui.hPwr.style.top = (90 - state.p*20) + "%"; let bTop = 90 - state.b*10; ui.hBrk.style.top = bTop + "%";
    }
    function showMsg(txt) { ui.msg.innerText = txt; ui.msg.style.display = 'block'; setTimeout(()=>ui.msg.style.display='none', 2000); }
    function gameOver(reason, win=false) {
        state.active = false; clearInterval(state.timerInt);
        if (audioCtx && masterGain) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05); if (sndWarn && !sndWarn.paused) { sndWarn.pause(); sndWarn.currentTime = 0; }
        ui.overlay.style.display = 'flex'; ui.menu.style.display = 'none'; ui.resBox.style.display = 'block'; ui.resBox.className = win ? "box win-box" : "box fail-box";
        document.getElementById('res-title').innerText = win ? "檢定通過" : "檢定失敗"; document.getElementById('res-desc').innerText = reason; document.getElementById('res-title').style.color = win ? "var(--color-ok)" : "var(--color-err)";
    }

    document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('start-sel'); STATIONS.forEach((s, i) => { let o = document.createElement('option'); o.value = i; o.innerText = s.name; sel.appendChild(o); });
        setInterval(()=>document.getElementById('ui-clock').innerText=new Date().toLocaleTimeString('zh-TW',{hour12:false}), 1000);
    });
    window.onload = () => { init3D(); };
</script>
